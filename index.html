<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USER ALBUM</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <h1>User Photo Album Viewer</h1>


        <div class="section" id="userSection">
            <label for="users_dropdown">Select User:</label>
            <select id="users_dropdown">
                <option value="">Select a user</option>
            </select>
        </div>



        <div class="section" id="albumSection">
            <h3 id="albumheading">Albums by </h3>
            <div class="album-grid" id="albumGrid"></div>
        </div>



        <div class="section" id="photoSection">
            <h3 id="photoheading">Photos in: </h3>
            <div class="photo-grid" id="photoGrid"></div>
        </div>
        <script src="index2.js"></script>
    </div>
</body>

</html>
